name: Build Wangguan V1.0.0 APK
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Unpack and test
        run: |
          unzip -t Wangguan_V1_0_0.zip
          unzip -o Wangguan_V1_0_0.zip
          cd Dale
          mkdir -p test-classes
          SRC=app/src/main/java/com/dale/todo
          javac -d test-classes "$SRC"/{Schedule,TaskTitle,ExplicitPlan,AiJsonEnvelope,CategoryLogic,CommandIntent,AssistantLearning,DailyReview}.java tests/*.java
          for f in tests/*Test.java; do java -cp test-classes "com.dale.todo.$(basename "$f" .java)" || exit 1; done
      - name: Install independent Android SDK
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="$RUNNER_TEMP/dale-android-sdk"
          mkdir -p "$SDK_ROOT/cmdline-tools/latest" "$RUNNER_TEMP/android-tools"
          curl -fL --retry 5 https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -o "$RUNNER_TEMP/android-tools/tools.zip"
          unzip -tq "$RUNNER_TEMP/android-tools/tools.zip"
          unzip -qo "$RUNNER_TEMP/android-tools/tools.zip" -d "$RUNNER_TEMP/android-tools"
          cp -a "$RUNNER_TEMP/android-tools/cmdline-tools/." "$SDK_ROOT/cmdline-tools/latest/"
          export ANDROID_HOME="$SDK_ROOT" ANDROID_SDK_ROOT="$SDK_ROOT"
          SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          chmod +x "$SDKMANAGER"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          "$SDKMANAGER" --version
          set +o pipefail
          yes | "$SDKMANAGER" --sdk_root="$SDK_ROOT" --licenses
          set -o pipefail
          for attempt in 1 2 3; do
            if "$SDKMANAGER" --sdk_root="$SDK_ROOT" 'platform-tools' 'platforms;android-35' 'build-tools;35.0.0' 'ndk;27.2.12479018' 'cmake;3.22.1'; then break; fi
            test "$attempt" -lt 3 || exit 1
            sleep 10
          done
          test -f "$SDK_ROOT/platforms/android-35/android.jar"
          test -f "$SDK_ROOT/ndk/27.2.12479018/source.properties"
          test -x "$SDK_ROOT/cmake/3.22.1/bin/cmake"
          test -x "$SDK_ROOT/build-tools/35.0.0/apksigner"
          printf 'sdk.dir=%s\n' "$SDK_ROOT" > Dale/local.properties
      - name: Voice model
        run: |
          curl -fL --retry 5 https://alphacephei.com/vosk/models/vosk-model-small-cn-0.22.zip -o model.zip
          unzip -tq model.zip
          unzip -q model.zip
          mkdir -p Dale/app/src/main/assets
          rm -rf Dale/app/src/main/assets/model-cn
          mv vosk-model-small-cn-0.22 Dale/app/src/main/assets/model-cn
      - name: Build signed APK
        env:
          WANGGUAN_SIGNING: ${{ secrets.WANGGUAN_SIGNING }}
        run: |
          test -n "$WANGGUAN_SIGNING"
          export WANGGUAN_PASSWORD="${WANGGUAN_SIGNING%%:*}"
          echo "::add-mask::$WANGGUAN_PASSWORD"
          export WANGGUAN_KEYSTORE="$RUNNER_TEMP/wangguan.p12"
          printf '%s' "${WANGGUAN_SIGNING#*:}" | base64 -d > "$WANGGUAN_KEYSTORE"
          chmod 600 "$WANGGUAN_KEYSTORE"
          cd Dale
          gradle assembleRelease --stacktrace
      - name: Verify signature and version
        id: version
        run: |
          APK=$(find Dale/app/build/outputs/apk/release -name '*.apk' -print -quit)
          test -n "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$APK"
          VERSION=$(sed -n "s/.*versionName '\([^']*\)'.*/\1/p" Dale/app/build.gradle)
          CODE=$(sed -n 's/.*versionCode \([0-9]*\).*/\1/p' Dale/app/build.gradle)
          test -n "$VERSION"
          test -n "$CODE"
          BADGING=$("$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK")
          grep -F "package: name='com.wangguan.todo'" <<< "$BADGING"
          grep -F "versionName='$VERSION'" <<< "$BADGING"
          grep -F "versionCode='$CODE'" <<< "$BADGING"
          echo "name=$VERSION" >> "$GITHUB_OUTPUT"
          mv "$APK" "$(dirname "$APK")/Wangguan-V$VERSION.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: Wangguan-V${{ steps.version.outputs.name }}-APK
          path: Dale/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
      - name: Publish verified APK and update manifest
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.name }}
        run: |
          set -euo pipefail
          APK="Dale/app/build/outputs/apk/release/Wangguan-V$VERSION.apk"
          CODE=$(sed -n 's/.*versionCode \([0-9]*\).*/\1/p' Dale/app/build.gradle)
          PKG=$(sed -n "s/.*applicationId '\([^']*\)'.*/\1/p" Dale/app/build.gradle)
          SHA=$(sha256sum "$APK" | cut -d' ' -f1)
          jq -n --arg packageName "$PKG" --arg versionName "$VERSION" --argjson versionCode "$CODE" --arg apk "$(basename "$APK")" --arg sha256 "$SHA" --argjson size "$(stat -c%s "$APK")" '{ $packageName, $versionName, $versionCode, $apk, $sha256, $size }' > update.json
          TAG="v$VERSION"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Version already published; increment version before rebuilding."
            exit 1
          fi
          gh release create "$TAG" "$APK" update.json --target "$GITHUB_SHA" --title "Wangguan V$VERSION" --notes "王冠每日计划首版；支持直接读取更新清单、下载续传及签名校验。" --latest
